<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Profile</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container py-4">
      <h1 class="mb-4">
        <span class="text-success fw-bold">Create</span>
        <i>Profile</i>
      </h1>

      <form action="" method="POST">
        <!-- General Information -->
        <div class="mb-5">
          <h3 class="section-title">General Information</h3>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">First Name</label>
              <input
                type="text"
                name="firstName"
                class="form-control"
                placeholder="Enter First Name"
              />
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Last Name</label>
              <input
                type="text"
                name="lastName"
                class="form-control"
                placeholder="Enter Last Name"
              />
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Department</label>
              <select name="department" class="form-select">
                <option value="CSE">CSE</option>
                <option value="EEE">EEE</option>
                <option value="CE">CE</option>
                <option value="LAW">LAW</option>
                <option value="PHARMACY">PHARMACY</option>
              </select>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">ID No</label>
              <input
                type="text"
                name="studentId"
                class="form-control"
                placeholder="Ex-2003008"
              />
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Session</label>
              <input
                type="text"
                name="session"
                class="form-control"
                placeholder="Ex-2020-2021"
              />
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Semester</label>
              <select name="semester" class="form-select">
                <option>1st year odd semester</option>
                <option>1st year even semester</option>
                <option>2nd year odd semester</option>
                <option>2nd year even semester</option>
              </select>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Blood Group</label>
              <input
                type="text"
                name="bloodGroup"
                class="form-control"
                placeholder="Enter Blood Group"
              />
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Date of Birth</label>
              <input type="date" name="dateOfBirth" class="form-control" />
            </div>
          </div>
        </div>

        <!-- Contact Information -->
        <div class="mb-5">
          <h3 class="section-title">Contact Information</h3>

          <div class="mb-3">
            <label class="form-label">Mobile No.</label>
            <input
              type="tel"
              name="mobile"
              class="form-control"
              placeholder="Enter Phone No."
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input
              type="email"
              name="email"
              class="form-control"
              placeholder="Enter your email"
            />
          </div>
        </div>

        <!-- Security Information -->
        <div class="mb-5">
          <h3 class="section-title">Security Information</h3>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input
              type="password"
              name="password"
              class="form-control"
              placeholder="Enter strong password"
            />
          </div>
        </div>

        <!-- Address Information -->
        <div class="mb-5">
          <h3 class="section-title">Address Information</h3>

          <div class="mb-3">
            <label class="form-label">Permanent Address</label>
            <input
              type="text"
              name="permanentAddress"
              class="form-control"
              placeholder="Enter Permanent Address"
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Present Address or Hall Name</label>
            <input
              type="text"
              name="presentAddress"
              class="form-control"
              placeholder="Enter Present Address"
            />
          </div>
        </div>

        <button type="submit" class="btn btn-success px-4">Create</button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
