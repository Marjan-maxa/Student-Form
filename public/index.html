<!doctype html>
<html lang="en">
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Profile</title>
    <style>
      .section-title {
        color: rgb(31, 31, 94);
        font-weight: 700;
        margin-top: 1.5rem;
        margin-bottom: 1rem;
      }
      .main-title {
        color: #2e7d32;
        font-weight: bold;
      }
      .main-title span {
        color: #2ecc71; /* হালকা সবুজ */
      }
      .form-label {
        font-weight: 500;
        margin-bottom: 0.4rem;
      }

      .form-control,
      .form-select {
        border: 1px solid #ced4da;
        border-radius: 0.375rem;
        padding: 0.45rem 0.75rem;
      }
      .btn-create {
        background-color: #22c55e;
        color: white;
        font-weight: 500;
        padding: 0.5rem 2rem;
        border: none;
        border-radius: 0.375rem;
      }
      .btn-create:hover {
        background-color: #16a34a;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="container my-5" style="max-width: 1000px">
      <h2 class="mb-4">
        <span style="color: #22c55e; font-weight: bold">Create</span>
        <span style="font-style: italic; font-weight: 300">Profile</span>
      </h2>

      <form>
        <div class="general-information">
          <h4 class="section-title">General Information</h4>

          <div class="row mb-3">
            <div class="col-md-6">
              <label for="firstName" class="form-label">First Name</label>
              <input
                type="text"
                class="form-control"
                id="firstName"
                placeholder="Enter First Name"
              />
            </div>
            <div class="col-md-6">
              <label for="lastName" class="form-label">Last Name</label>
              <input
                type="text"
                class="form-control"
                id="lastName"
                placeholder="Enter Last Name"
              />
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label for="dept" class="form-label">Department</label>
              <select name="dept" id="dept" class="form-select">
                <option value="CSE">CSE</option>
                <option value="EEE">EEE</option>
                <option value="CE">CE</option>
                <option value="PHARMACY">PHARMACY</option>
                <option value="LAW">LAW</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="idNo" class="form-label">ID No</label>
              <input
                type="text"
                class="form-control"
                id="idNo"
                placeholder="Ex-2003008"
              />
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label for="session" class="form-label">Session</label>
              <input
                type="text"
                class="form-control"
                id="session"
                placeholder="Ex-2020-2021"
              />
            </div>
            <div class="col-md-6">
              <label for="semester" class="form-label">Semester</label>
              <select name="semester" id="semester" class="form-select">
                <option value="1st-odd">1st year odd semester</option>
                <option value="1st-even">1st year even semester</option>
                <option value="2nd-odd">2nd year odd semester</option>
              </select>
            </div>
          </div>

          <div class="row mb-4">
            <div class="col-md-6">
              <label for="bloodGroup" class="form-label">Blood Group</label>
              <input
                type="text"
                class="form-control"
                id="bloodGroup"
                placeholder="Enter Blood Group"
              />
            </div>
            <div class="col-md-6">
              <label for="dob" class="form-label">Date of Birth</label>
              <input type="date" class="form-control" id="dob" />
            </div>
          </div>
        </div>

        <div class="contact-information">
          <h4 class="section-title">Contact Information</h4>
          <div class="mb-3">
            <label for="mobile" class="form-label">Mobile No.</label>
            <input
              type="text"
              class="form-control"
              id="mobile"
              placeholder="Enter Phone No."
            />
          </div>
          <div class="mb-4">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="Enter your email"
            />
          </div>
        </div>

        <div class="security-information">
          <h4 class="section-title">Security Information</h4>
          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Enter strong password"
            />
          </div>
        </div>

        <div class="address-information">
          <h4 class="section-title">Address Information</h4>
          <div class="mb-3">
            <label for="permanentAddress" class="form-label"
              >Permanent Address</label
            >
            <input
              type="text"
              class="form-control"
              id="permanentAddress"
              placeholder="Enter Permanent Address"
            />
          </div>
          <div class="mb-4">
            <label for="presentAddress" class="form-label"
              >Present Address or Hall Name</label
            >
            <input
              type="text"
              class="form-control"
              id="presentAddress"
              placeholder="Enter Present Address"
            />
          </div>
        </div>

        <div class="mt-4">
          <button type="submit" class="btn btn-create">Create</button>
        </div>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
